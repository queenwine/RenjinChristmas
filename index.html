<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ต้นคริสต์มาสควบคุมด้วยมือ</title>
<style>
html,body{margin:0;height:100%;background:#0b0d12;overflow:hidden;font-family:system-ui,"Noto Sans Thai",sans-serif;color:#eee}
#gl{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
#ui{position:fixed;left:14px;top:14px;font-size:14px;line-height:1.7;max-width:270px;z-index:2}
#ui button{background:#ffffff14;color:#fff;border:1px solid #ffffff40;border-radius:8px;padding:6px 12px;margin:0 6px 6px 0;font:inherit;cursor:pointer}
#ui button:hover{background:#ffffff30}
#status{color:#ffd76a;min-height:1.6em}
#help{opacity:.75;font-size:13px}
#pip{position:fixed;right:12px;bottom:12px;width:150px;height:200px;border-radius:12px;overflow:hidden;border:1px solid #fff3;display:none;z-index:2}
#pip video,#pip canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="ui">
  <button id="cam">📷 เปิดกล้อง</button><br>
  <button id="bGrow">🌲 โตขึ้น</button><button id="bGift">🎁 ของขวัญ</button><button id="bSpark">✨ ระยิบระยับ</button>
  <div id="status">ลากเมาส์เพื่อหมุนต้นไม้ได้ หรือกด “เปิดกล้อง”</div>
  <div id="help">
    ✋ แบมมือ = ต้นไม้งอกขึ้น<br>
    ✊ กำมือ = ต้นไม้หายไป<br>
    ✌️ ชู 2 นิ้ว = สลับของขวัญ<br>
    🤏 จีบนิ้ว = ประกายสีรุ้ง<br>
    ↔️ ขยับมือซ้าย/ขวา = หมุนต้นไม้<br>
    🙌 สองมือ ห่าง/ใกล้ = ซูมเข้า/ออก
  </div>
</div>
<div id="pip"><video id="vid" playsinline muted></video><canvas id="ov" width="300" height="400"></canvas></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script type="module">
import {FilesetResolver, HandLandmarker} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm";

const $ = id => document.getElementById(id);
const canvas = $("gl");
const renderer = new THREE.WebGLRenderer({canvas, antialias:false});
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, 1, .1, 100);
camera.position.set(0, 1.6, 8.5); camera.lookAt(0, 2.1, 0);

/* ---------- สร้างอนุภาคของต้นไม้ ---------- */
const P=[], C=[], T=[], S=[], G=[], PH=[];
const col = new THREE.Color();
function add(x,y,z,c,t,s,g){ P.push(x,y,z); C.push(c.r,c.g,c.b); T.push(t); S.push(s); G.push(g); PH.push(Math.random()); }
const lights = [0xff4d4d,0xffd24d,0x4da6ff,0xc44dff,0x4dff9a,0xff8c4d];

// ต้นสนเป็นชั้น ๆ (group 0 = โผล่ตามความสูง)
for(let i=0;i<9000;i++){
  const t = Math.random(), f = (t*6)%1;
  const r = (1-t)*1.8*(0.4+0.6*(1-f))*(0.55+0.45*Math.sqrt(Math.random()));
  const a = Math.random()*Math.PI*2, y = 0.6 + t*4.2;
  if(Math.random()<0.1) col.setHex(lights[(Math.random()*lights.length)|0]);
  else col.setHSL(0.31+Math.random()*0.05, 0.6, 0.22+Math.random()*0.3);
  add(Math.cos(a)*r, y, Math.sin(a)*r, col, t*0.97, 1.0+Math.random()*0.5, 0);
}
// ลำต้น
for(let i=0;i<300;i++){ const a=Math.random()*6.28, r=Math.random()*.16; col.setHSL(.07,.5,.2+Math.random()*.1); add(Math.cos(a)*r, Math.random()*.7, Math.sin(a)*r, col, 0.001, 1.1, 0); }
// ดาวบนยอด
for(let i=0;i<80;i++){ const a=Math.random()*6.28, r=Math.random()*.28; col.setHex(0xffe58a); add(Math.cos(a)*r, 4.95+(Math.random()-.5)*.5, Math.sin(a)*r*.4, col, 0.995, 1.8, 0); }
// ลายวงกลมบนพื้น (แสดงตลอด)
for(let k=1;k<=14;k++){ const R=k*.2, n=Math.floor(R*70); for(let i=0;i<n;i++){ const a=i/n*6.283; col.setHSL(.12,.6,.25+(k%3)*.1); add(Math.cos(a)*R, 0, Math.sin(a)*R, col, 0, .9, 2); } }
// กล่องของขวัญ (group 1)
[[1.3,.2,.4],[1.0,.2,-1],[-1.2,.2,.6],[-.5,.2,1.4],[.3,.2,-1.5]].forEach((p,gi)=>{
  const s=.3+Math.random()*.12, base=new THREE.Color(lights[(gi*2)%lights.length]);
  for(let i=0;i<160;i++){
    const u=[Math.random()-.5,Math.random()-.5,Math.random()-.5]; const ax=(Math.random()*3)|0; u[ax]=Math.random()<.5?-.5:.5;
    col.copy(base).multiplyScalar(Math.abs(u[0])>.45&&Math.abs(u[2])<.08?1.4:.85+Math.random()*.2);
    add(p[0]+u[0]*s*2, p[1]+u[1]*s*2, p[2]+u[2]*s*2, col, 0, 1.2, 1);
  }
});

const geo = new THREE.BufferGeometry();
geo.setAttribute("position", new THREE.Float32BufferAttribute(P,3));
geo.setAttribute("aColor",   new THREE.Float32BufferAttribute(C,3));
geo.setAttribute("aT",       new THREE.Float32BufferAttribute(T,1));
geo.setAttribute("aSize",    new THREE.Float32BufferAttribute(S,1));
geo.setAttribute("aGroup",   new THREE.Float32BufferAttribute(G,1));
geo.setAttribute("aPhase",   new THREE.Float32BufferAttribute(PH,1));

const U = {uGrow:{value:0}, uGift:{value:0}, uBurst:{value:0}, uTime:{value:0}, uPx:{value:1}};
const mat = new THREE.ShaderMaterial({
  uniforms:U, transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
  vertexShader:`
    attribute vec3 aColor; attribute float aT, aSize, aGroup, aPhase;
    uniform float uGrow, uGift, uBurst, uTime, uPx;
    varying vec3 vC; varying float vA;
    void main(){
      float show = 1.0;
      if(aGroup < .5) show = step(aT, uGrow) * step(.001, uGrow);
      else if(aGroup < 1.5) show = step(.5, uGift) * step(.95, uGrow);
      float tw = .65 + .35*sin(uTime*3. + aPhase*40.);
      vec3 rb = .5 + .5*cos(6.283*(aPhase + uTime*.4 + vec3(0.,.33,.67)));
      vC = mix(aColor, rb*1.3, uBurst*.85) * tw;
      vA = show;
      vec3 p = position;
      p.y += (1.-show) * 0.;
      vec4 mv = modelViewMatrix * vec4(p,1.);
      gl_Position = projectionMatrix * mv;
      gl_PointSize = aSize * uPx * (1. + uBurst*.8) * 26. / -mv.z * show;
    }`,
  fragmentShader:`
    varying vec3 vC; varying float vA;
    void main(){ if(vA < .5) discard; gl_FragColor = vec4(vC, 1.); }`
});
const tree = new THREE.Points(geo, mat);
scene.add(tree);

/* ---------- หิมะ ---------- */
const sp = [], sph = [];
for(let i=0;i<700;i++){ sp.push((Math.random()-.5)*16, Math.random()*9, (Math.random()-.5)*10); sph.push(Math.random()); }
const sg = new THREE.BufferGeometry();
sg.setAttribute("position", new THREE.Float32BufferAttribute(sp,3));
sg.setAttribute("aPhase", new THREE.Float32BufferAttribute(sph,1));
const snow = new THREE.Points(sg, new THREE.ShaderMaterial({
  uniforms:U, transparent:true, depthWrite:false,
  vertexShader:`
    attribute float aPhase; uniform float uTime, uPx;
    void main(){
      vec3 p = position;
      p.y = mod(p.y - uTime*(.25+aPhase*.4), 9.);
      p.x += sin(uTime*.5 + aPhase*20.)*.3;
      vec4 mv = modelViewMatrix * vec4(p,1.);
      gl_Position = projectionMatrix * mv;
      gl_PointSize = (.8 + aPhase*1.2) * uPx * 26. / -mv.z;
    }`,
  fragmentShader:`void main(){ gl_FragColor = vec4(.85,.9,1.,.7); }`
}));
scene.add(snow);

/* ---------- สถานะ ---------- */
const st = {target:0, giftTarget:0, rot:0, spin:0, zoom:1, zoomT:1, lastGift:0, lastPinch:0, handsSeen:false};
function setStatus(t){ $("status").textContent = t; }
const burst = () => { U.uBurst.value = 1; };

$("bGrow").onclick  = () => { st.target = st.target>.5 ? 0 : 1; };
$("bGift").onclick  = () => { st.giftTarget = 1 - st.giftTarget; };
$("bSpark").onclick = burst;

// ลากเมาส์/นิ้วเพื่อหมุน
let drag=null;
canvas.addEventListener("pointerdown", e => drag=e.clientX);
addEventListener("pointerup", () => drag=null);
addEventListener("pointermove", e => { if(drag!==null){ st.rot += (e.clientX-drag)*.01; drag=e.clientX; } });

function resize(){
  const w=innerWidth, h=innerHeight, dpr=Math.min(devicePixelRatio||1,2);
  renderer.setPixelRatio(dpr); renderer.setSize(w,h,false);
  camera.aspect=w/h; camera.updateProjectionMatrix();
  U.uPx.value = dpr * Math.min(h/800, w/500 + .3);
}
addEventListener("resize", resize); resize();

/* ---------- ตรวจจับมือ ---------- */
const d = (a,b) => Math.hypot(a.x-b.x, a.y-b.y);
function analyze(lm){
  const w = lm[0], palm = d(lm[0], lm[9]);
  const ext = (tip,pip) => d(lm[tip], w) > d(lm[pip], w)*1.12;
  const f = [ext(8,6), ext(12,10), ext(16,14), ext(20,18)];
  const n = f.filter(Boolean).length;
  return {
    open: n===4, fist: n===0,
    peace: f[0] && f[1] && !f[2] && !f[3],
    pinch: d(lm[4], lm[8]) < palm*.28,
    x: 1 - lm[9].x, wrist: {x:1-lm[0].x, y:lm[0].y}
  };
}

let landmarker=null, running=false, lastVideoTime=-1;
const vid=$("vid"), ov=$("ov"), octx=ov.getContext("2d");
const CONN=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];

function detect(){
  if(!running) return;
  if(vid.readyState>=2 && vid.currentTime!==lastVideoTime){
    lastVideoTime = vid.currentTime;
    const res = landmarker.detectForVideo(vid, performance.now());
    octx.clearRect(0,0,ov.width,ov.height);
    const hands = res.landmarks.map(analyze);
    res.landmarks.forEach(lm=>{
      octx.strokeStyle="#fff"; octx.fillStyle="#fff"; octx.lineWidth=2;
      CONN.forEach(([a,b])=>{ octx.beginPath(); octx.moveTo(lm[a].x*ov.width,lm[a].y*ov.height); octx.lineTo(lm[b].x*ov.width,lm[b].y*ov.height); octx.stroke(); });
      lm.forEach(p=>{ octx.beginPath(); octx.arc(p.x*ov.width,p.y*ov.height,3,0,6.3); octx.fill(); });
    });
    const now = performance.now();
    if(hands.length){
      const h = hands[0]; let msg="";
      if(h.pinch){ if(now-st.lastPinch>700){ burst(); st.lastPinch=now; } msg="🤏 ประกายสีรุ้ง!"; }
      else if(h.open){ st.target=1; msg="✋ ต้นไม้กำลังงอก"; }
      else if(h.fist){ st.target=0; msg="✊ เก็บต้นไม้"; }
      else if(h.peace){ if(now-st.lastGift>1200){ st.giftTarget=1-st.giftTarget; st.lastGift=now; } msg="✌️ สลับของขวัญ"; }
      st.spin = (h.x-.5)*4;
      if(hands.length>1){
        const dd = Math.hypot(hands[0].wrist.x-hands[1].wrist.x, hands[0].wrist.y-hands[1].wrist.y);
        st.zoomT = Math.min(1.7, Math.max(.6, .6 + (dd-.15)*2.2));
        msg += " · 🙌 ซูม";
      }
      setStatus(msg || "เจอมือแล้ว ลองแบมมือดู");
    } else { st.spin = 0; setStatus("ยังไม่เจอมือ — ยกมือให้อยู่ในกล้อง"); }
  }
  requestAnimationFrame(detect);
}

$("cam").onclick = async () => {
  $("cam").disabled = true; setStatus("กำลังโหลดโมเดลตรวจจับมือ…");
  try{
    const fs = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
    landmarker = await HandLandmarker.createFromOptions(fs, {
      baseOptions:{ modelAssetPath:"https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task", delegate:"GPU" },
      runningMode:"VIDEO", numHands:2
    });
    vid.srcObject = await navigator.mediaDevices.getUserMedia({video:{facingMode:"user", width:640, height:480}});
    await vid.play();
    $("pip").style.display="block"; running=true; detect();
    $("cam").style.display="none"; setStatus("พร้อมแล้ว! ลองแบมมือดู ✋");
  }catch(err){
    console.error(err); $("cam").disabled=false;
    setStatus("เปิดกล้องไม่ได้: " + (err.message||err) + " (ลองเปิดผ่าน http://localhost ดู)");
  }
};

/* ---------- วนลูปวาด ---------- */
let prev = performance.now();
function loop(now){
  const dt = Math.min(.05,(now-prev)/1000); prev = now;
  U.uTime.value = now/1000;
  const mv = (cur,tg,sp) => cur + Math.max(-sp*dt, Math.min(sp*dt, tg-cur));
  U.uGrow.value = mv(U.uGrow.value, st.target, .4);
  U.uGift.value = mv(U.uGift.value, st.giftTarget, 5);
  U.uBurst.value = Math.max(0, U.uBurst.value - dt*.7);
  st.rot += (st.spin + (U.uGrow.value>0 ? .15 : 0)) * dt;
  st.zoom += (st.zoomT - st.zoom) * Math.min(1, dt*4);
  tree.rotation.y = st.rot; tree.scale.setScalar(st.zoom);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
